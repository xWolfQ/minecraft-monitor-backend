services:
  postgres:
    image: postgres:16-alpine
    container_name: mc-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mc_monitor
      POSTGRES_USER: monitor_user
      POSTGRES_PASSWORD: secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: